name: Run Alpaca Trading Bot

on:
  schedule:
    - cron: '*/30 13-20 * * 1-5' # تشغيل آلي كل 30 دقيقة أثناء ساعات تداول السوق الأمريكي
  workflow_dispatch: # يتيح إمكانية التشغيل اليدوي بضغطة زر

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # إلغاء العملية تلقائياً بعد 5 دقائق لتجنب حالة التعليق

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance alpaca-py requests

      - name: Execute Trading Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trading_bot.py
