name: Run Alpaca Trading Bot

on:
  schedule:
    - cron: '*/30 13-20 * * 1-5' # تشغيل كل 30 دقيقة أثناء ساعات السوق الأمريكي
  workflow_dispatch: # إكانية التشغيل اليدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # تم التحديث إلى v4

      - name: Set up Python
        uses: actions/setup-python@v5  # تم التحديث إلى v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance alpaca-py requests

      - name: Execute Trading Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trading_bot.py
